[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentry"
version = "0.3.0"
description = "AST-based Python static analyzer with SARIF output, an incremental cache and a planted-defect corpus."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nathaniel Gordon", email = "nathanielgordon346@gmail.com" }]
keywords = ["static-analysis", "linter", "sarif", "code-review", "pre-commit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
codesentry = "reviewer.__main__:main"

[project.urls]
Homepage = "https://github.com/nathaniel-gordon/codesentry"

[tool.setuptools]
packages = ["reviewer"]

[tool.codesentry]
# Defaults this repository analyzes itself with. `codesentry review` reads this
# section from the nearest pyproject.toml unless --no-config is passed.
packs = ["security", "correctness", "complexity", "maintainability"]
max-complexity = 12
max-nesting = 5
max-fn-lines = 70
max-params = 6
max-line-len = 110
max-imports = 14
ignore = []
exclude = ["output", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["reviewer"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["output", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # long lines are the analyzer's own long-line rule's business
  "SIM108",  # ternaries are not always clearer than if/else here
  "B905",    # zip(strict=) is noise on pairs built from the same AST node
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"reviewer/datagen.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
files = ["reviewer"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
