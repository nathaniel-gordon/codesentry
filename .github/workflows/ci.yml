name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        run: python -m ruff check reviewer tests
      - name: mypy
        run: python -m mypy reviewer

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.14 is what the author runs.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: tests with coverage
        run: >-
          python -m pytest tests -q
          --cov=reviewer --cov-report=term --cov-report=xml
      - name: upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  self-check:
    name: demo, evaluation and probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: readiness probe
        run: codesentry health --json
      - name: planted-defect corpus
        run: codesentry demo
      - name: per-rule precision and recall
        run: codesentry eval
      - name: review this repository with itself
        run: >-
          codesentry review reviewer
          --format sarif --format json --out sarif-out
          --fail-on-severity high --metrics-out sarif-out/run.prom
      - name: upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-review
          path: |
            sarif-out/
            output/evaluation.json

  container:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t codesentry:ci .
      - name: liveness probe inside the image
        run: docker run --rm codesentry:ci health --probe liveness
      - name: review a mounted tree
        run: >-
          docker run --rm -v "$PWD/reviewer:/work/reviewer:ro" codesentry:ci
          review reviewer --quiet --stdout --format json

  code-scanning:
    name: upload sarif
    runs-on: ubuntu-latest
    needs: self-check
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: analyze this repository with itself
        run: codesentry review reviewer --format sarif --out sarif-out
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-out/review.sarif
          category: codesentry
