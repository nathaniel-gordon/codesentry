- id: codesentry
  name: codesentry (AST static analysis)
  description: Analyze staged Python files and block the commit on high-severity findings
  entry: codesentry review
  language: python
  types: [python]
  pass_filenames: true
  args: [--quiet, --stdout, --format, json, --fail-on-severity, high]

- id: codesentry-security
  name: codesentry (security pack only)
  description: Run only the security rules over staged Python files
  entry: codesentry review
  language: python
  types: [python]
  pass_filenames: true
  args: [--quiet, --stdout, --format, json, --pack, security, --fail-on-severity, high]
